# MultiQC Configuration File

report_comment: 
  Custom MultiQC configuration for project.

export_plots: true
disable_version_detection: true

# Run only these modules
run_modules:
  - fastqc
  - fastp
  - samtools
  - picard
  - stringtie
  - featureCounts
  - qualimap
  - dupRadar  # Ensure this module is available or remove if not found
  - rseqc

# Order of modules
top_modules:
  - "fastqc_raw"
  - "fastp"
  - "fastqc_trimmed"
  - "samtools"
  - "picard"
  - "stringtie"
  - "featureCounts"
  - "qualimap"
  - "dupRadar"  # Ensure this module is available or remove if not found
  - "rseqc"

module_order:
  - fastqc:
      name: "FastQC (raw)"
      info: "FastQC results before trimming."
      path_filters:
        - "./results/fastqc/*/*.fastqc.zip"
        - "./results/fastqc/*/*.fastqc.html"
  - fastp:
      name: "Fastp"
      path_filters:
        - "./results/trimmed/*/*.fastp.json"
        - "./results/trimmed/*/*.fastp.html"
  - fastqc:
      name: "FastQC (trimmed)"
      info: "FastQC results after trimming."
      path_filters:
        - "./results/trimmed/*/fastqc/*.fastp_fastqc.zip"
        - "./results/trimmed/*/fastqc/*.fastp_fastqc.html"
  - samtools:
      path_filters:
        - "./results/align/bam_original/*/*.stats"
        - "./results/align/bam_original/*/*.flagstat"
        - "./results/align/bam_original/*/*.idxstats"
        - "./results/align/bam_markup/*/*.stats"
        - "./results/align/bam_markup/*/*.flagstat"
        - "./results/align/bam_markup/*/*.idxstats"
  - picard:
      path_filters:
        - "./results/picard/*/*.MarkDuplicates.metrics.txt"
  - stringtie:
      path_filters:
        - "./results/stringtie/*/*.txt"
  - featureCounts:
      path_filters:
        - "./results/feature_counts/*/*.summary"
        - "./results/feature_counts/*/*.tsv"
  - qualimap:
      path_filters:
        - "./results/qualimap/*/*.html"
  - dupradar:  # Ensure this module is available or remove if not found
      path_filters:
        - "./results/dupradar/*/*.pdf"
  - rseqc:
      path_filters:
        - "./results/rseqc/bam_stat/*/*.bam_stat.txt"
        - "./results/rseqc/infer_experiment/*/*.infer_experiment.txt"
        - "./results/rseqc/inner_distance/*/*.inner_distance.txt"
        - "./results/rseqc/read_distribution/*/*.read_distribution.txt"
        - "./results/rseqc/read_duplication/*/*.readdup.DupRate_plot.pdf"
        - "./results/rseqc/read_GC/*/*.readgc.GC_plot.pdf"
        - "./results/rseqc/junction_saturation/*/*.junctionSaturation_plot.pdf"

# Customize table columns visibility
table_columns_visible:
  fastqc:
    percent_duplicates: False

# Extensions to be cleaned from filenames
extra_fn_clean_exts:
  - ".markdup"

# Custom module search patterns
sp:
  fastqc:
    fn: "*.fastqc.zip"
  fastp:
    fn: "*.fastp.json"
  samtools/stats:
    fn: "*.stats"
  picard/markdups:
    fn: "*.MarkDuplicates.metrics.txt"
  stringtie:
    fn: "*.txt"
  featureCounts:
    fn: "*.summary"
  qualimap:
    fn: "*.html"
  dupradar:  # Ensure this module is available or remove if not found
    fn: "*.pdf"
  rseqc/bam_stat:
    fn: "*.bam_stat.txt"
  rseqc/read_distribution:
    fn: "*.read_distribution.txt"
