# MultiQC Configuration File
# RNA-seq Quality Control Report Configuration

# Report metadata
title: "RNA-seq Quality Control Report"
subtitle: "Generated by Snakemake RNA-seq Pipeline"
intro_text: "This report contains quality control metrics for RNA-seq data analysis, including FastQC results before and after trimming, alignment statistics, and quantification metrics."

# Performance and behavior settings
export_plots: true
export_plots_timeout: 60
disable_version_detection: true
sample_names_replace_exact: true

# Only run these modules (improves performance)
run_modules:
  - fastqc
  - fastp
  - cutadapt
  - star
  - picard
  - samtools
  - rseqc
  - featurecounts

# Section order - higher numbers appear first
# Must match the 'anchor' values in module_order below
report_section_order:
  # Pre-processing and QC
  fastqc_raw:
    order: 4000
  fastp:
    order: 3900
  cutadapt:
    order: 3900
  fastqc_trimmed:
    order: 3800
  # Alignment
  star:
    order: 3000
  # Post-alignment QC
  samtools:
    order: 2900
  picard:
    order: 2800
  rseqc:
    order: 2700
  # Quantification
  featurecounts:
    order: 2000

# Module order with separate FastQC instances
module_order:
  # FastQC for raw reads (before trimming)
  - fastqc:
      anchor: "fastqc_raw"
      name: "FastQC (raw)"
      info: "Quality control metrics for raw FASTQ files before adapter trimming and quality filtering."
      path_filters:
        - "*_raw_*_fastqc.zip"

  # Trimming tools
  - fastp:
      anchor: "fastp"
      name: "FastP"
      info: "Adapter trimming and quality control with FastP."
  - cutadapt:
      anchor: "cutadapt"
      name: "Trim Galore"
      info: "Adapter trimming with Trim Galore (wrapper around Cutadapt)."
      path_filters:
        - "*trimming_report.txt"

  # FastQC for trimmed reads (after trimming)
  - fastqc:
      anchor: "fastqc_trimmed"
      name: "FastQC (trimmed)"
      info: "Quality control metrics for trimmed FASTQ files after adapter removal and quality filtering."
      path_filters:
        - "*_trimmed_*_fastqc.zip"

  # Alignment
  - star:
      anchor: "star"
      name: "STAR"
      info: "Alignment statistics and metrics from STAR aligner."
      path_filters:
        - "*Log.final.out"

  # Post-alignment QC
  - samtools:
      anchor: "samtools"
      name: "Samtools"
      info: "BAM file statistics from Samtools."
      path_filters:
        - "*.bam.stats"
        - "*.bam.flagstat"
        - "*.bam.idxstats"
  - picard:
      anchor: "picard"
      name: "Picard MarkDuplicates"
      info: "Duplicate marking statistics from Picard."
      path_filters:
        - "*.MarkDuplicates.metrics.txt"

  # RSeQC
  - rseqc:
      anchor: "rseqc"
      name: "RSeQC"
      info: "Comprehensive RNA-seq quality control metrics from RSeQC suite."
      path_filters:
        - "*.bam_stat.txt"
        - "*.infer_experiment.txt"
        - "*.read_distribution.txt"
        - "*.inner_distance.txt"
        - "*.junction_annotation.log"
        - "*.tin.summary.txt"

  # Quantification
  - featurecounts:
      anchor: "featurecounts"
      name: "featureCounts"
      info: "Gene-level read assignment statistics from featureCounts."
      path_filters:
        - "*.fc.summary"

# Table configuration - control columns visibility
table_columns_visible:
  "FastQC (raw)":
    percent_duplicates: false  # We get this from Picard
    percent_gc: true
    avg_sequence_length: true
    total_sequences: true
  "FastQC (trimmed)":
    percent_duplicates: false  # We get this from Picard
    percent_gc: true
    avg_sequence_length: true
    total_sequences: true

# Keep sample names as-is - preserve important identifiers
extra_fn_clean_exts:
  - ".fastq.gz"
  - ".fq.gz"
  - "_fastqc"
  - ".fastp"
  - ".Log.final.out"

# Preserve sample name structure
fn_clean_sample_names: true

# Optimized file search patterns for better performance
sp:
  fastqc/zip:
    fn: "*_fastqc.zip"

  fastp:
    fn: "*.fastp.json"

  cutadapt:
    fn: "*trimming_report.txt"

  star:
    fn: "*.Log.final.out"

  featurecounts:
    fn: "*.fc.summary"

  samtools/stats:
    fn: "*.bam.stats"
  samtools/flagstat:
    fn: "*.bam.flagstat"
  samtools/idxstats:
    fn: "*.bam.idxstats"

  picard/markdups:
    fn: "*.MarkDuplicates.metrics.txt"
 
  # RSeQC modules used by MultiQC
  rseqc/bam_stat:
    fn: "*.bam_stat.txt"
  rseqc/infer_experiment:
    fn: "*.infer_experiment.txt"
  rseqc/read_distribution:
    fn: "*.read_distribution.txt"
  rseqc/inner_distance:
    fn: "*.inner_distance.txt"
  rseqc/junction_annotation:
    fn: "*.junction_annotation.log"
  rseqc/tin:
    fn: "*.tin.summary.txt"

# Display settings
collapse_tables: false
show_analysis_paths: false
show_analysis_time: true

# Number formatting
decimalPoint_format: "."
thousands_sep_format: ","
