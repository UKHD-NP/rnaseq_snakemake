# Snakemake LSF profile for HPC execution
# Usage: snakemake --profile workflow/profiles/lsf [other options]
#
# Requirements: snakemake-executor-plugin-lsf
#   pip install snakemake-executor-plugin-lsf
#
# Submit manually from a submission node with bsub access.
# Adjust lsf_queue values to match available queues (short, medium, long, etc.).

executor: lsf

# Default LSF job options (overridden per-rule via resources: in .smk files)
default-resources:
  lsf_queue: "long"
  lsf_extra: "'-env all'"
  mem_mb: 8192
  runtime: 120

# Job submission settings
jobs: 50
rerun-incomplete: true
latency-wait: 60
keep-going: true

# Conda environments
use-conda: true
conda-frontend: mamba
# Store conda envs outside home (20 GB quota!) - update path to your analysis share
conda-prefix: "/path/to/group/storage/conda_envs"

# Retries on job failure
retries: 5

# Global cores cap: controls --cores passed to each per-job subprocess
cores: 500

# Per-rule resource overrides
set-resources:

  # ---- FASTQC ----
  fastqc_raw:
    lsf_queue: "long"

  fastqc_trimmed:
    lsf_queue: "long"

  # ---- TRIMMING ----
  trim_galore:
    lsf_queue: "verylong"

  fastp:
    lsf_queue: "verylong"

  sortmerna:
    lsf_queue: "verylong"

  # ---- INDEX ----
  star_genome_generate:
    lsf_queue: "verylong"

  # ---- ALIGNMENT ----
  star_align:
    lsf_queue: "verylong"

  # ---- BAM PROCESSING ----
  sort_bam:
    lsf_queue: "long"

  mark_duplicates:
    lsf_queue: "verylong"

  arriba:
    lsf_queue: "verylong"

  bamcoverage_bigwig:
    lsf_queue: "verylong"

  # ---- POST ALIGNMENT QC ----
  samtools_stats:
    lsf_queue: "long"

  # ---- COUNT ----
  salmon:
    lsf_queue: "long"

  featurecounts:
    lsf_queue: "long"

  stringtie:
    lsf_queue: "verylong"

  # ---- POST QC ----
  dupradar:
    lsf_queue: "long"

  # ---- FINAL ----
  multiqc:
    lsf_queue: "medium"
