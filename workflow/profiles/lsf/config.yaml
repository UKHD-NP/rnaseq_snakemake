# Snakemake LSF profile for DKFZ HPC execution
# Usage: snakemake --profile workflow/profiles/lsf [other options]
#
# Requirements: snakemake-executor-plugin-lsf
#   pip install snakemake-executor-plugin-lsf
#
# Submit manually with bsub on bsub01.lsf.dkfz.de or bsub02.lsf.dkfz.de.
# Adjust lsf_queue values to match available queues (short, medium, long, etc.).

executor: lsf

# Default LSF job options (overridden per-rule via resources: in .smk files)
default-resources:
  lsf_queue: "long"
  lsf_extra: "''"
  mem_mb: 8192
  runtime: 120
  threads: 2

# Job submission settings
jobs: 100
rerun-incomplete: true
latency-wait: 60
keep-going: false

# Conda environments
use-conda: true
conda-frontend: mamba
# Store conda envs outside home (20 GB quota!) - update path to your analysis share
conda-prefix: "/omics/odcf/analysis/YOUR_GROUP/conda_envs"

# Retries on job failure
retries: 2

# Global cores cap: controls --cores passed to each per-job subprocess
cores: 1000

# Per-rule thread overrides (sets actual Snakemake threads, affects --cores in subprocess)
set-threads:
  trim_galore: 12
  fastp: 12
  star_genome_generate: 16
  star_align: 16
  sort_bam: 10
  arriba: 16
  mark_duplicates: 12
  salmon: 12
  featurecounts: 6
  stringtie: 6
  multiqc: 2

# Per-rule resource overrides (mem_mb matches rule definitions)
set-resources:
  trim_galore:
    mem_mb: 36864
    threads: 12
    runtime: 9999
    lsf_queue: "verylong"
  fastp:
    mem_mb: 16384
    threads: 12
    runtime: 9999
    lsf_queue: "verylong"
  star_genome_generate:
    mem_mb: 40960
    threads: 16
    runtime: 9999
    lsf_queue: "verylong"
  star_align:
    mem_mb: 40960
    threads: 16
    runtime: 9999
    lsf_queue: "verylong"
  sort_bam:
    mem_mb: 40960
    threads: 10
    runtime: 480
  arriba:
    mem_mb: 50000
    threads: 16
    runtime: 9999
    lsf_queue: "verylong"
  mark_duplicates:
    mem_mb: 36864
    threads: 12
    runtime: 480
  salmon:
    mem_mb: 36864
    threads: 12
    runtime: 480
  featurecounts:
    mem_mb: 36864
    threads: 6
    runtime: 480
  stringtie:
    mem_mb: 36864
    threads: 6
    runtime: 480
  multiqc:
    mem_mb: 8192
    threads: 2
    runtime: 240
