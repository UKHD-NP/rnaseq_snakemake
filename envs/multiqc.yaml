name: multiqc
description: Aggregate results from bioinformatics analyses into a single report using MultiQC.
keywords:
  - multiqc
  - quality control
  - qc
  - report
  - bioinformatics
tools:
  - multiqc:
      description: |
        MultiQC is a tool to aggregate results from bioinformatics analyses across many samples into a single report. 
        It is written in Python and contains modules for a large number of common bioinformatics tools.
      homepage: https://multiqc.info/
      documentation: https://multiqc.info/docs/
      doi: 10.1093/bioinformatics/btw354
      licence: ["MIT"]
channels:
  - bioconda
  - conda-forge
dependencies:
  - multiqc=1.23