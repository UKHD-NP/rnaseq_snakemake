# Path or URL to the sample sheet (CSV format, columns: sample_id, fq1, fq2, outdir)
samples_csv: "test_data/samplesheet_test.csv"
 
ref:
  assembly: "custom"    # choices: hg19, hg38, chm13v2, m39, custom
  fasta: "test_data/references/genome.fasta"
  gtf: "test_data/references/genome.gtf"  # GTF file for StringTie and dupRadar
  star_index: "test_data/references/staridx"

fastp_params:
  ffpe: >-
    --cut_front
    --cut_tail
    --cut_window_size 2
    --cut_mean_quality 20
    --length_required 50
  total_rna: >-
    --trim_front1 1
    --trim_front2 1
    --length_required 50
  other: >-

trim_galore_params:
  ffpe: >-
    --quality 20
    --length 50
    --clip_R1 5
    --clip_R2 5
  total_rna: >-
    --nextseq 25
    --length 50
  other: >-

trimming:
  enabled: true
  delete_trimming: true  # Delete trimmed FASTQ files after pipeline completes (only applies when enabled: true)
  tool: "fastp"  # Choose trimming tool: "fastp" or "trim_galore"
  param_type: "total_rna"  # Choose parameter set: "ffpe", "total_rna"

sortmerna:
  enabled: true  # Remove rRNA reads with SortMeRNA (CPU-only, reference-based; runs after trimming, before alignment)
  delete_sortmerna: true  # Delete non-rRNA FASTQ files after pipeline completes (only applies when enabled: true)
  extra_params: ""  # optional additional sortmerna CLI arguments
  # ref_db is set automatically: the pipeline auto-downloads the SortMeRNA rRNA reference database
  # into references/sortmerna_db/ the first time it's needed.

star_params:
  index: >-
    --sjdbOverhang 99
  default: >-
    --genomeLoad NoSharedMemory
    --quantMode TranscriptomeSAM 
    --twopassMode Basic 
    --outSAMtype BAM Unsorted 
    --outFilterMultimapNmax 20 
    --alignSJDBoverhangMin 1 
    --outSAMattributes NH HI AS NM MD 
    --outSAMstrandField intronMotif  
    --quantTranscriptomeSAMoutput BanSingleEnd
  fusion: >-
    --genomeLoad NoSharedMemory
    --outSAMtype BAM Unsorted
    --outStd BAM_Unsorted
    --outSAMunmapped Within
    --outBAMcompression 0
    --outFilterMultimapNmax 50
    --peOverlapNbasesMin 10
    --alignSplicedMateMapLminOverLmate 0.5
    --alignSJstitchMismatchNmax 5 -1 5 5
    --chimSegmentMin 10
    --chimOutType WithinBAM HardClip
    --chimJunctionOverhangMin 10
    --chimScoreDropMax 30
    --chimScoreJunctionNonGTAG 0
    --chimScoreSeparation 1
    --chimSegmentReadGapMax 3
    --chimMultimapNmax 50
  ffpe: >-
    --outSAMtype BAM Unsorted
    --genomeLoad LoadAndKeep
    --outFilterMultimapNmax 5
    --sjdbOverhang 99
    --quantMode TranscriptomeSAM
  total_rna: >-
    --genomeLoad NoSharedMemory
    --alignMatesGapMax 1100000
    --quantMode TranscriptomeSAM
    --quantTranscriptomeSAMoutput BanSingleEnd
    --twopassMode Basic
    --twopass1readsN -1
    --outSAMtype BAM Unsorted
    --outFilterMultimapNmax 20
    --outFilterMultimapScoreRange 1
    --outSAMattributes NH HI NM MD AS XS
    --outSAMstrandField intronMotif
    --sjdbOverhang 99
    --alignSJoverhangMin 8
    --outFilterMismatchNoverLmax 0.1
    --outFilterMismatchNmax 10
    --alignIntronMin 20 
    --alignIntronMax 1100000
    --peOverlapNbasesMin 10
    --peOverlapMMp 0.05
    --alignSplicedMateMapLminOverLmate 0.5
    --alignSJstitchMismatchNmax 5 -1 5 5
    --chimOutType WithinBAM SoftClip
    --chimJunctionOverhangMin 10
    --chimScoreMin 1
    --chimScoreDropMax 30
    --chimScoreJunctionNonGTAG 0 
    --chimScoreSeparation 1
    --chimSegmentMin 10
    --chimSegmentReadGapMax 3
    --limitSjdbInsertNsj 2000000 
    --outSJfilterOverhangMin 8 8 8 8 
    --outSJfilterCountUniqueMin 3 1 1 1 
    --outSJfilterCountTotalMin 3 1 1 1 
    --sjdbGTFtagExonParentTranscript Parent 
    --outSAMunmapped Within KeepPairs
    --outFilterMatchNminOverLread 0.33
    --outFilterScoreMinOverLread 0.33
    --sjdbScore 2
    --alignSJDBoverhangMin 1

alignment:
  param_type: "total_rna"  # Choose parameter set: "ffpe", "total_rna"

genome_load_keep_memory:
  enabled: false

salmon_params:
  total_rna: >-
    --libType=ISR
    --gcBias --seqBias --posBias
    --useVBOpt
    --numGibbsSamples 100
    --rangeFactorizationBins 4
  ffpe: >-
    --gcBias --seqBias --posBias
    --libType A

salmon_counts:
  enabled: true
  param_type: "total_rna" # Choose parameter set: "ffpe", "total_rna"

markduplicates:
  enabled: true

fusion:
  enabled: true

featurecounts:
  enabled: true
  extra_params: "-f --fracOverlap 0.2"  # optional additional featureCounts CLI arguments
  feature_type: "exon"  # feature type to count
  attribute: "exon_id"  # GTF attribute to use for feature IDs

stringtie:
  enabled: true
  strand: "rf"  # "rf" (reverse/dUTP, most RNA-seq), "fr" (forward), "" (unstranded)

dupradar:
  enabled: true
  stranded: 2  # 0=unstranded, 1=stranded, 2=reverse (default)
  paired: "paired"  # "paired" or "single"

bigwig:
  enabled: true  # Generate CPM-normalized forward/reverse bigWig tracks for IGV (deeptools bamCoverage, reverse-stranded/dUTP protocol)
  bin_size: 10  # deeptools --binSize (bp); smaller = finer resolution, larger file
  extra_params: ""  # optional additional deeptools bamCoverage CLI arguments

rseqc:
  enabled: false
  bam_stat:
    enabled: true
  infer_experiment:
    enabled: true
  inner_distance:
    enabled: true
  read_distribution:
    enabled: true
  read_duplication:
    enabled: true
  read_GC:
    enabled: true
  junction_annotation:
    enabled: true
  junction_saturation:
    enabled: true
  gene_body_coverage:
    enabled: true
  tin:
    enabled: true

latency-wait: 60
